[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-trigger"
version = "0.1.0"
description = "Evolution TG Trigger for a2a agents"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "a2a-sdk>=0.3.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "telegramify-markdown>=0.1.0",
    "SpeechRecognition>=3.10.0",
    "pydub>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

